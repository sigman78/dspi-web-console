name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR pushes are cancelled; a running master run is never cancelled
# (only a still-queued one, when a newer push supersedes it).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Release PRs are opened with GITHUB_TOKEN, so their runs need approval and
    # never report; skip them. The merge commit is verified on master and again
    # by Release Please before tagging.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
